<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Author List</title>

    <style>

         *, *::before, *::after {
             box-sizing: border-box;
         }

         body {
             font-family: Arial, sans-serif;
             background: #f4f6f8;
             margin: 0;
             padding: 40px;
             color: #333;
             min-height: 100dvh;
             display: flex;
             flex-direction: column;
         }


             .container {
                 max-width: 900px;
                 margin: 0 auto;
             }

             h1 {
                 text-align: center;
                 margin-bottom: 30px;
             }

             table {
                 width: 100%;
                 border-collapse: collapse;
                 background: white;
                 border-radius: 10px;
                 overflow: hidden;
                 box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
             }

             th, td {
                 padding: 14px 18px;
                 text-align: left;
                 border-bottom: 1px solid #eee;
             }

             th {
                 background: #222;
                 color: white;
             }

             tr:last-child td {
                 border-bottom: none;
             }

             tbody tr:hover {
                 background: #f8f9fa;
             }
    </style>
</head>

<body>

<div class="container">

    <h1>Author List</h1>

    <table>
        <thead>
        <tr>
            <th>id</th>
            <th>FirstName</th>
            <th>LastName</th>
            <th>Books</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="author : ${authors}">
            <td th:text="${author.id}">23</td>
            <td th:text="${author.firstName}">kunal</td>
            <td th:text="${author.lastName}">natesh</td>

            <td>
                <span th:each="book, stat : ${author.books}"
                      th:text="${book.title + (stat.last ? '' : ', ')}"></span>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
